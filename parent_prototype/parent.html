<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Worksheet Launcher - Parent (Starter)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 12px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    label { font-weight: 600; display: block; margin: 10px 0 6px; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    textarea { min-height: 56px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    button.primary { border-color: #111; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { color: #666; font-size: 12px; margin-top: 6px; }
    pre { background: #f7f7f7; border: 1px solid #eee; padding: 12px; border-radius: 12px; overflow: auto; }
    .ok { color: #0a7; }
    .bad { color: #c33; }
    .small { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Parent App (Starter) — opens OIDC popup worksheet and receives results</h1>

  <div class="card">
    <div class="row">
      <div style="flex:1; min-width: 240px;">
        <label for="title">Worksheet Title</label>
        <input id="title" type="text" value="Quick Check" />
        <div class="hint">This title is shown in the popup.</div>
      </div>
      <div style="min-width: 240px;">
        <label>Popup Status</label>
        <div id="popupStatus" class="small">(not opened)</div>
        <div class="hint">If blocked, allow popups for this site.</div>
      </div>
    </div>

    <label>Questions (1–5)</label>
    <textarea id="q1">用一句說明今日學到嘅重點。</textarea>
    <textarea id="q2">用一個例子解釋。</textarea>
    <textarea id="q3">你仲有咩問題？</textarea>
    <textarea id="q4" placeholder="(optional)"></textarea>
    <textarea id="q5" placeholder="(optional)"></textarea>

    <div class="row" style="margin-top: 12px;">
      <button id="openBtn" class="primary">Open Worksheet Popup</button>
      <button id="clearBtn">Clear Result</button>
      <span class="small" id="securityInfo"></span>
    </div>
  </div>

  <div class="card">
    <label>Returned Result</label>
    <pre id="result">(waiting)</pre>
  </div>

<script>
/**
 * =========================
 * CONFIG (EDIT THESE)
 * =========================
 * The popup render page MUST be hosted on your server (OIDC protected),
 * because rewrite API is also protected.
 */
const CONFIG = {
  // Example: "https://app.example.edu.hk"
  RENDER_ORIGIN: "https://YOUR_OIDC_HOST",

  // Example: "/worksheet/render.html"
  RENDER_PATH: "/worksheet/render.html",

  // Security: only accept postMessage from this exact origin
  TRUSTED_SENDER_ORIGIN: "https://YOUR_OIDC_HOST"
};

/**
 * =========================
 * Minimal "Launcher" core
 * =========================
 * Later you can extract this into a reusable JS file:
 *   openWorksheetPopup({title, questions}) => Promise<result>
 */

let currentRid = null;
let popupRef = null;

// UI elements
const elPopupStatus = document.getElementById("popupStatus");
const elResult = document.getElementById("result");
const elSecurityInfo = document.getElementById("securityInfo");

elSecurityInfo.textContent = `Trusted sender: ${CONFIG.TRUSTED_SENDER_ORIGIN}`;

// Helpers
function makeRid() {
  // good enough for prototype; replace with crypto.randomUUID() if you want
  return "rid_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
}

function collectQuestions() {
  const q = [];
  for (let i = 1; i <= 5; i++) {
    const v = document.getElementById("q" + i).value.trim();
    if (v) q.push(v);
  }
  if (q.length < 1) throw new Error("Please enter at least 1 question.");
  if (q.length > 5) throw new Error("Max 5 questions.");
  return q;
}

function base64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  const b64 = btoa(bin);
  return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function buildPopupUrl({ worksheet, rid }) {
  const renderUrl = CONFIG.RENDER_ORIGIN + CONFIG.RENDER_PATH;

  // payload in hash
  const w = base64urlEncode(JSON.stringify(worksheet));
  const returnOrigin = encodeURIComponent(window.location.origin);

  return `${renderUrl}#w=${w}&rid=${encodeURIComponent(rid)}&returnOrigin=${returnOrigin}`;
}

function setStatus(text, ok=null) {
  elPopupStatus.textContent = text;
  elPopupStatus.className = ok === true ? "ok" : ok === false ? "bad" : "small";
}

// Receive result from popup
window.addEventListener("message", (event) => {
  // Security: only accept from trusted sender
  if (event.origin !== CONFIG.TRUSTED_SENDER_ORIGIN) return;

  const data = event.data;
  if (!data || data.type !== "worksheetResult") return;

  // Ensure the response matches the popup request
  if (!currentRid || data.rid !== currentRid) return;

  elResult.textContent = JSON.stringify(data, null, 2);
  setStatus("Result received ✅", true);

  // Optional: auto close popup
  try { popupRef && popupRef.close(); } catch (e) {}
});

// Buttons
document.getElementById("openBtn").addEventListener("click", () => {
  try {
    const worksheet = {
      v: 1,
      title: document.getElementById("title").value.trim() || "Worksheet",
      q: collectQuestions(),
      rewrite: true
    };

    const rid = makeRid();
    currentRid = rid;

    const url = buildPopupUrl({ worksheet, rid });

    // Open popup (must be from a user click)
    popupRef = window.open(url, "worksheetPopup", "width=900,height=720");

    if (!popupRef) {
      setStatus("Popup blocked. Please allow popups.", false);
      return;
    }

    setStatus("Popup opened. Waiting for result…", null);

    // Optional: detect popup closed
    const timer = setInterval(() => {
      if (!popupRef || popupRef.closed) {
        clearInterval(timer);
        // If no result has arrived yet
        if (currentRid === rid) setStatus("Popup closed (no result).", false);
      }
    }, 600);

  } catch (err) {
    alert(err.message || String(err));
  }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  elResult.textContent = "(waiting)";
  setStatus("(not opened)", null);
  currentRid = null;
});
</script>
</body>
</html>
