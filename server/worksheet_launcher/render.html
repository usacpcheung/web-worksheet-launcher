<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worksheet Render</title>
  <link rel="stylesheet" href="widgets/rewrite-widget.css" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 12px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .small { font-size: 12px; color: #666; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .question-text { margin-bottom: 6px; line-height: 1.45; }
    .question-hint { margin-top: 6px; margin-bottom: 8px; }
    .rw-host { margin-top: 10px; }
    .worksheet-light-theme .card { padding: 16px; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    button.primary { border-color: #111; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .ok { color: #0a7; }
    .bad { color: #c33; }
  </style>
</head>
<body>
  <h1 id="title">Worksheet</h1>
  <div class="small" id="meta">Loading…</div>

  <div id="questions" class="worksheet-light-theme"></div>

  <div class="card">
    <div class="small" id="flowHint">Write answers in each question box, use Rewrite if needed, then click Send Back to Parent.</div>
    <div class="row">
      <button id="sendBackBtn" class="primary">Send Back to Parent</button>
      <button id="printBtn">Print</button>
    </div>
    <div class="small" id="status"></div>
  </div>

<script src="widgets/rewrite-widget.js"></script>
<script>
function parseQueryParams() {
  const sp = new URLSearchParams(location.search);
  return {
    launchId: sp.get("launchId")
  };
}


function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

const { launchId } = parseQueryParams();
const elTitle = document.getElementById("title");
const elMeta = document.getElementById("meta");
const elQuestions = document.getElementById("questions");
const elStatus = document.getElementById("status");
const elFlowHint = document.getElementById("flowHint");
const elSendBackBtn = document.getElementById("sendBackBtn");

const runtimeState = {
  rid: "",
  worksheet: null,
  returnOrigin: "",
  normalizedReturnOrigin: ""
};

function applyErrorState(message) {
  elMeta.textContent = message;
  elMeta.className = "small bad";
  elStatus.textContent = message;
  elStatus.className = "small bad";
  elSendBackBtn.disabled = true;
}

function getConsumeAuthHeaders() {
  const headers = { "content-type": "application/json" };

  const openerConfig = window.opener && window.opener.CONFIG ? window.opener.CONFIG : null;
  if (openerConfig && openerConfig.AUTH_TOKEN) {
    headers.authorization = `Bearer ${openerConfig.AUTH_TOKEN}`;
  }
  if (openerConfig && openerConfig.TENANT_ID) {
    headers["x-tenant-id"] = openerConfig.TENANT_ID;
  }
  if (openerConfig && openerConfig.CLIENT_ID) {
    headers["x-client-id"] = openerConfig.CLIENT_ID;
  }
  if (openerConfig && openerConfig.USER_ID) {
    headers["x-user-id"] = openerConfig.USER_ID;
  }

  const rendererSessionId = window.sessionStorage.getItem("worksheet_renderer_session_id");
  if (rendererSessionId) {
    headers["x-renderer-session-id"] = rendererSessionId;
  }

  return headers;
}

async function consumeLaunchContext() {
  if (!launchId || !launchId.trim()) {
    throw new Error("Missing launchId in query string. Expected ?launchId=<opaque-id>.");
  }

  const response = await fetch("/api/launches/consume", {
    method: "POST",
    headers: getConsumeAuthHeaders(),
    credentials: "same-origin",
    body: JSON.stringify({ launchId })
  });

  let payload = null;
  try {
    payload = await response.json();
  } catch (e) {}

  if (!response.ok) {
    const errorCode = payload && payload.error ? payload.error.code : "unknown_error";
    const friendlyErrors = {
      unauthorized: "Unauthorized launch access. Please re-open from the parent app.",
      not_found: "Launch is missing or invalid. Please start again from the parent app.",
      expired: "This launch has expired. Please start again from the parent app.",
      already_consumed: "This launch has already been used. Please create a new launch.",
      invalid_payload: "Invalid launch request. Please re-open the popup from parent."
    };
    throw new Error(friendlyErrors[errorCode] || `Unable to load launch (${errorCode}).`);
  }

  const resolved = payload || {};
  if (!resolved || typeof resolved.rid !== "string" || !resolved.rid.trim()) {
    throw new Error("Launch response is missing rid.");
  }
  if (!resolved.worksheet || resolved.worksheet.v !== 1 || !Array.isArray(resolved.worksheet.q) || resolved.worksheet.q.length < 1) {
    throw new Error("Invalid worksheet schema (v=1, q length 1..N).");
  }
  if (typeof resolved.returnOrigin !== "string" || !resolved.returnOrigin.trim()) {
    throw new Error("Launch response is missing returnOrigin.");
  }

  return resolved;
}

function initializeRuntimeState(resolvedLaunch) {
  runtimeState.rid = resolvedLaunch.rid;
  runtimeState.worksheet = resolvedLaunch.worksheet;
  runtimeState.returnOrigin = resolvedLaunch.returnOrigin;

  try {
    const parsedReturnOrigin = new URL(runtimeState.returnOrigin);
    if (parsedReturnOrigin.protocol === "http:" || parsedReturnOrigin.protocol === "https:") {
      runtimeState.normalizedReturnOrigin = parsedReturnOrigin.origin;
    }
  } catch (e) {
    runtimeState.normalizedReturnOrigin = "";
  }

  if (!runtimeState.normalizedReturnOrigin) {
    throw new Error("Invalid returnOrigin from launch context.");
  }

  elTitle.textContent = runtimeState.worksheet.title || "Worksheet";
  elMeta.textContent = `rid=${runtimeState.rid} • questions=${runtimeState.worksheet.q.length}`;
  elMeta.className = "small";
  elFlowHint.textContent = runtimeState.worksheet.q.length === 1
    ? "Answer the question, optionally click Rewrite, then click Send Back to Parent."
    : "Answer each question in order, optionally click Rewrite per question, then click Send Back to Parent.";
}

const widgetControllers = [];

async function renderQuestions() {
  for (const [idx, qText] of runtimeState.worksheet.q.entries()) {
    const card = document.createElement("div");
    card.className = "card";

    const hostId = `rw_host_${idx}`;
    card.innerHTML = `
      <div class="question-text"><b>Q${idx + 1}.</b> ${escapeHtml(qText)}</div>
      <div class="small question-hint">Write your response here. Rewrite is optional.</div>
      <div id="${hostId}" class="rw-host"></div>
    `;
    elQuestions.appendChild(card);

    await RewriteWidget.mount({
      containerSelector: `#${hostId}`,
      apiBase: "",
      title: `Answer ${idx + 1}`,
      placeholder: "Type your answer, then click Rewrite if you want a polished version.",
      maxChars: 1200,
      statusPollIntervalMs: 5000,
      pollModelStatus: true
    });

    const textarea = card.querySelector(".rw-textarea");
    widgetControllers[idx] = {
      index: idx,
      question: qText,
      getAnswerText: () => (textarea ? textarea.value : "")
    };
  }
}

function buildAnswersPayload() {
  return widgetControllers.map((controller, idx) => {
    const answerText = controller.getAnswerText().trim();
    return {
      index: idx,
      question: controller.question,
      answer: answerText,
      raw: answerText,
      rewritten: answerText
    };
  });
}

consumeLaunchContext()
  .then((resolvedLaunch) => {
    initializeRuntimeState(resolvedLaunch);
    return renderQuestions();
  })
  .catch((err) => {
    applyErrorState(String(err?.message || err));
  });

// Send back to parent
elSendBackBtn.addEventListener("click", () => {
  const payload = {
    type: "worksheetResult",
    rid: runtimeState.rid,
    worksheet: {
      v: runtimeState.worksheet.v,
      title: runtimeState.worksheet.title,
      q: runtimeState.worksheet.q
    },
    answers: buildAnswersPayload(),
    meta: { sentAt: new Date().toISOString() }
  };

  if (!runtimeState.normalizedReturnOrigin) {
    elStatus.textContent = "Cannot send result: returnOrigin is missing or invalid.";
    elStatus.className = "small bad";
    return;
  }

  if (!window.opener) {
    elStatus.textContent = "No opener found (opened with noopener?). Cannot send back.";
    elStatus.className = "small bad";
    return;
  }

  window.opener.postMessage(payload, runtimeState.normalizedReturnOrigin);
  elStatus.textContent = "Sent back to parent ✅";
  elStatus.className = "small ok";
});

document.getElementById("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
