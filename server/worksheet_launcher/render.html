<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worksheet Render</title>
  <link rel="stylesheet" href="widgets/rewrite-widget.css" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 12px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .small { font-size: 12px; color: #666; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .question-text { margin-bottom: 6px; line-height: 1.45; }
    .question-hint { margin-top: 6px; margin-bottom: 8px; }
    .rw-host { margin-top: 10px; }
    .worksheet-light-theme .card { padding: 16px; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    button.primary { border-color: #111; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .ok { color: #0a7; }
    .bad { color: #c33; }
  </style>
</head>
<body>
  <h1 id="title">Worksheet</h1>
  <div class="small" id="meta">Loading…</div>

  <div id="questions" class="worksheet-light-theme"></div>

  <div class="card">
    <div class="small" id="flowHint">Write answers in each question box, use Rewrite if needed, then click Send Back to Parent.</div>
    <div class="row">
      <button id="sendBackBtn" class="primary">Send Back to Parent</button>
      <button id="printBtn">Print</button>
    </div>
    <div class="small" id="status"></div>
  </div>

<script src="widgets/rewrite-widget.js"></script>
<script>

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

const launchId = new URLSearchParams(location.search).get("launchId");
const elTitle = document.getElementById("title");
const elMeta = document.getElementById("meta");
const elQuestions = document.getElementById("questions");
const elStatus = document.getElementById("status");
const elFlowHint = document.getElementById("flowHint");
const elSendBackBtn = document.getElementById("sendBackBtn");
elSendBackBtn.disabled = true;

const runtimeState = {
  rid: "",
  worksheet: null,
  returnOrigin: "",
  normalizedReturnOrigin: ""
};

const widgetControllers = [];

async function renderQuestions() {
  for (const [idx, qText] of runtimeState.worksheet.q.entries()) {
    const card = document.createElement("div");
    card.className = "card";

    const hostId = `rw_host_${idx}`;
    card.innerHTML = `
      <div class="question-text"><b>Q${idx + 1}.</b> ${escapeHtml(qText)}</div>
      <div class="small question-hint">Write your response here. Rewrite is optional.</div>
      <div id="${hostId}" class="rw-host"></div>
    `;
    elQuestions.appendChild(card);

    await RewriteWidget.mount({
      containerSelector: `#${hostId}`,
      apiBase: "",
      title: `Answer ${idx + 1}`,
      placeholder: "Type your answer, then click Rewrite if you want a polished version.",
      maxChars: 1200,
      statusPollIntervalMs: 5000,
      pollModelStatus: true
    });

    const textarea = card.querySelector(".rw-textarea");
    widgetControllers[idx] = {
      index: idx,
      question: qText,
      getAnswerText: () => (textarea ? textarea.value : "")
    };
  }
}

function buildAnswersPayload() {
  return widgetControllers.map((controller, idx) => {
    const answerText = controller.getAnswerText().trim();
    return {
      index: idx,
      question: controller.question,
      answer: answerText,
      raw: answerText,
      rewritten: answerText
    };
  });
}

function getLaunchErrorMessage(err) {
  const status = err?.status;
  const code = String(err?.code || "").toLowerCase();

  if (code === "missing_launch" || status === 400) {
    return "Missing launch. Open this popup from the parent app and try again.";
  }
  if (code === "expired_launch" || status === 410) {
    return "This launch link has expired. Reopen the worksheet from the parent app.";
  }
  if (code === "launch_already_consumed" || code === "consumed_launch" || status === 409) {
    return "This launch has already been used. Start a new worksheet launch from the parent app.";
  }
  if (code === "unauthorized_launch" || code === "unauthorized" || status === 401 || status === 403) {
    return "You are not authorized to open this worksheet launch.";
  }
  if (status === 404) {
    return "Launch not found. It may be invalid or already expired.";
  }
  return "Unable to start this worksheet launch. Please try again from the parent app.";
}

function getConsumePayload(body) {
  if (!body || typeof body !== "object") return null;
  if (body.launch && typeof body.launch === "object") return body.launch;
  if (body.data && typeof body.data === "object") return body.data;
  return body;
}

function validateAndApplyRuntimeState(payload) {
  if (!payload || typeof payload !== "object") {
    throw new Error("Invalid launch response payload.");
  }

  const { rid, worksheet, returnOrigin } = payload;
  let normalizedReturnOrigin = "";
  try {
    const parsedReturnOrigin = new URL(returnOrigin);
    if (parsedReturnOrigin.protocol === "http:" || parsedReturnOrigin.protocol === "https:") {
      normalizedReturnOrigin = parsedReturnOrigin.origin;
    }
  } catch (e) {
    normalizedReturnOrigin = "";
  }

  if (!rid || !returnOrigin || !worksheet || worksheet.v !== 1 || !Array.isArray(worksheet.q) || worksheet.q.length < 1) {
    throw new Error("Launch payload is missing required worksheet data.");
  }

  runtimeState.rid = rid;
  runtimeState.worksheet = worksheet;
  runtimeState.returnOrigin = returnOrigin;
  runtimeState.normalizedReturnOrigin = normalizedReturnOrigin;

  elTitle.textContent = worksheet.title || "Worksheet";
  elMeta.textContent = `rid=${rid} • questions=${worksheet.q.length}`;
  elMeta.className = "small";
  elFlowHint.textContent = worksheet.q.length === 1
    ? "Answer the question, optionally click Rewrite, then click Send Back to Parent."
    : "Answer each question in order, optionally click Rewrite per question, then click Send Back to Parent.";

  if (!normalizedReturnOrigin) {
    elStatus.textContent = "Invalid returnOrigin in launch payload. Cannot send result back to parent.";
    elStatus.className = "small bad";
    elSendBackBtn.disabled = true;
  }
}

async function consumeLaunch() {
  if (!launchId) {
    throw { code: "missing_launch", status: 400 };
  }

  const response = await fetch(`/api/worksheet-launch/consume?launchId=${encodeURIComponent(launchId)}`, {
    method: "POST",
    headers: { "Accept": "application/json" }
  });

  let body = null;
  try {
    body = await response.json();
  } catch (e) {
    body = null;
  }

  if (!response.ok) {
    throw {
      status: response.status,
      code: body?.error?.code || body?.code,
      message: body?.error?.message || body?.message
    };
  }

  return getConsumePayload(body);
}

async function initializeRenderer() {
  try {
    const payload = await consumeLaunch();
    validateAndApplyRuntimeState(payload);
    await renderQuestions();
    if (runtimeState.normalizedReturnOrigin) {
      elSendBackBtn.disabled = false;
    }
  } catch (err) {
    const message = err?.message && typeof err.message === "string"
      ? err.message
      : getLaunchErrorMessage(err);
    elMeta.textContent = message;
    elMeta.className = "small bad";
    elStatus.textContent = "Worksheet could not be loaded.";
    elStatus.className = "small bad";
    elSendBackBtn.disabled = true;
  }
}

initializeRenderer();

// Send back to parent
elSendBackBtn.addEventListener("click", () => {
  if (!runtimeState.worksheet) {
    elStatus.textContent = "Worksheet is not ready yet.";
    elStatus.className = "small bad";
    return;
  }

  const payload = {
    type: "worksheetResult",
    rid: runtimeState.rid,
    worksheet: {
      v: runtimeState.worksheet.v,
      title: runtimeState.worksheet.title,
      q: runtimeState.worksheet.q
    },
    answers: buildAnswersPayload(),
    meta: { sentAt: new Date().toISOString() }
  };

  if (!runtimeState.normalizedReturnOrigin) {
    elStatus.textContent = "Cannot send result: returnOrigin is missing or invalid.";
    elStatus.className = "small bad";
    return;
  }

  if (!window.opener) {
    elStatus.textContent = "No opener found (opened with noopener?). Cannot send back.";
    elStatus.className = "small bad";
    return;
  }

  window.opener.postMessage(payload, runtimeState.normalizedReturnOrigin);
  elStatus.textContent = "Sent back to parent ✅";
  elStatus.className = "small ok";
});

document.getElementById("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
