<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worksheet Render</title>
  <link rel="stylesheet" href="widgets/rewrite-widget.css" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 12px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .small { font-size: 12px; color: #666; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .question-text { margin-bottom: 6px; line-height: 1.45; }
    .question-hint { margin-top: 6px; margin-bottom: 8px; }
    .rw-host { margin-top: 10px; }
    .worksheet-light-theme .card { padding: 16px; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    button.primary { border-color: #111; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .ok { color: #0a7; }
    .bad { color: #c33; }
  </style>
</head>
<body>
  <h1 id="title">Worksheet</h1>
  <div class="small" id="meta">Loading…</div>

  <div id="questions" class="worksheet-light-theme"></div>

  <div class="card">
    <div class="small" id="flowHint">Write answers in each question box, use Rewrite if needed, then click Send Back to Parent.</div>
    <div class="row">
      <button id="sendBackBtn" class="primary">Send Back to Parent</button>
      <button id="printBtn">Print</button>
    </div>
    <div class="small" id="status"></div>
  </div>

<script src="widgets/rewrite-widget.js"></script>
<script>
function parseHashParams() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const sp = new URLSearchParams(raw);
  return {
    w: sp.get("w"),
    rid: sp.get("rid"),
    returnOrigin: sp.get("returnOrigin")
  };
}

const LAUNCH_STORAGE_PREFIX = "worksheetLaunch:";
const LAUNCH_STORAGE_TTL_MS = 15 * 60 * 1000;

function readLaunchFromHash() {
  return parseHashParams();
}

function validateLaunch(launch) {
  if (!launch || !launch.w || !launch.rid || !launch.returnOrigin) {
    return { ok: false, reason: "missing" };
  }

  let normalizedReturnOrigin = "";
  try {
    const parsedReturnOrigin = new URL(launch.returnOrigin);
    if (parsedReturnOrigin.protocol === "http:" || parsedReturnOrigin.protocol === "https:") {
      normalizedReturnOrigin = parsedReturnOrigin.origin;
    }
  } catch (e) {
    normalizedReturnOrigin = "";
  }

  return {
    ok: true,
    w: launch.w,
    rid: launch.rid,
    returnOrigin: launch.returnOrigin,
    normalizedReturnOrigin
  };
}

function saveLaunchToSession(launch) {
  try {
    sessionStorage.setItem(
      `${LAUNCH_STORAGE_PREFIX}${launch.rid}`,
      JSON.stringify({
        w: launch.w,
        rid: launch.rid,
        returnOrigin: launch.returnOrigin,
        savedAt: Date.now()
      })
    );
    sessionStorage.setItem(`${LAUNCH_STORAGE_PREFIX}lastRid`, launch.rid);
  } catch (e) {
    // Ignore storage failures (private mode, quota limits, etc.).
  }
}

function clearLaunchFromSession(rid) {
  if (!rid) return;
  try {
    const lastRidKey = `${LAUNCH_STORAGE_PREFIX}lastRid`;
    const lastRid = sessionStorage.getItem(lastRidKey);
    if (lastRid === rid) {
      sessionStorage.removeItem(lastRidKey);
    }
    sessionStorage.removeItem(`${LAUNCH_STORAGE_PREFIX}${rid}`);
  } catch (e) {
    // Ignore storage failures.
  }
}

function readLaunchFromSession(rid) {
  const now = Date.now();
  try {
    const keys = [];
    for (let i = 0; i < sessionStorage.length; i += 1) {
      const key = sessionStorage.key(i);
      if (!key || !key.startsWith(LAUNCH_STORAGE_PREFIX) || key === `${LAUNCH_STORAGE_PREFIX}lastRid`) {
        continue;
      }
      keys.push(key);
    }

    let mostRecentLaunch = null;
    for (const key of keys) {
      const raw = sessionStorage.getItem(key);
      if (!raw) continue;

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        sessionStorage.removeItem(key);
        continue;
      }

      if (!parsed || !parsed.rid || !parsed.savedAt || (now - parsed.savedAt) > LAUNCH_STORAGE_TTL_MS) {
        sessionStorage.removeItem(key);
        continue;
      }

      const validated = validateLaunch(parsed);
      if (!validated.ok || !validated.normalizedReturnOrigin) {
        sessionStorage.removeItem(key);
        continue;
      }

      if (rid && parsed.rid !== rid) {
        continue;
      }

      if (!mostRecentLaunch || parsed.savedAt > mostRecentLaunch.savedAt) {
        mostRecentLaunch = {
          w: validated.w,
          rid: validated.rid,
          returnOrigin: validated.returnOrigin,
          normalizedReturnOrigin: validated.normalizedReturnOrigin,
          savedAt: parsed.savedAt
        };
      }
    }

    if (mostRecentLaunch) {
      return mostRecentLaunch;
    }

    const lastRid = sessionStorage.getItem(`${LAUNCH_STORAGE_PREFIX}lastRid`);
    if (!lastRid || (rid && lastRid !== rid)) {
      return null;
    }

    const latestRaw = sessionStorage.getItem(`${LAUNCH_STORAGE_PREFIX}${lastRid}`);
    if (!latestRaw) {
      return null;
    }

    const latest = JSON.parse(latestRaw);
    if (!latest || !latest.savedAt || (now - latest.savedAt) > LAUNCH_STORAGE_TTL_MS) {
      clearLaunchFromSession(lastRid);
      return null;
    }

    const validated = validateLaunch(latest);
    if (!validated.ok || !validated.normalizedReturnOrigin) {
      clearLaunchFromSession(lastRid);
      return null;
    }

    return {
      w: validated.w,
      rid: validated.rid,
      returnOrigin: validated.returnOrigin,
      normalizedReturnOrigin: validated.normalizedReturnOrigin,
      savedAt: latest.savedAt
    };
  } catch (e) {
    return null;
  }
}

function base64urlDecodeToString(b64url) {
  const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64url.length + 3) % 4);
  const bin = atob(b64);
  const bytes = new Uint8Array([...bin].map(ch => ch.charCodeAt(0)));
  return new TextDecoder().decode(bytes);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

const elTitle = document.getElementById("title");
const elMeta = document.getElementById("meta");
const elQuestions = document.getElementById("questions");
const elStatus = document.getElementById("status");
const elFlowHint = document.getElementById("flowHint");
const elSendBackBtn = document.getElementById("sendBackBtn");

let w = "";
let rid = "";
let returnOrigin = "";
let normalizedReturnOrigin = "";

const hashLaunch = readLaunchFromHash();
const validatedHashLaunch = validateLaunch(hashLaunch);

if (validatedHashLaunch.ok) {
  ({ w, rid, returnOrigin, normalizedReturnOrigin } = validatedHashLaunch);
  saveLaunchToSession({ w, rid, returnOrigin });
} else {
  const restoredLaunch = readLaunchFromSession();
  if (restoredLaunch) {
    ({ w, rid, returnOrigin, normalizedReturnOrigin } = restoredLaunch);
  }
}

if (!w || !rid || !returnOrigin) {
  elMeta.textContent = "Missing hash params. Expected #w=...&rid=...&returnOrigin=...";
  elMeta.className = "small bad";
  throw new Error("Missing hash params");
}

if (!normalizedReturnOrigin) {
  elStatus.textContent = "Invalid returnOrigin. Use an absolute http(s) origin in the launch hash.";
  elStatus.className = "small bad";
  elSendBackBtn.disabled = true;
}

let worksheet;
try {
  worksheet = JSON.parse(base64urlDecodeToString(w));
} catch (e) {
  elMeta.textContent = "Invalid worksheet payload.";
  elMeta.className = "small bad";
  throw e;
}

if (!worksheet || worksheet.v !== 1 || !Array.isArray(worksheet.q) || worksheet.q.length < 1) {
  elMeta.textContent = "Invalid worksheet schema (v=1, q length 1..N).";
  elMeta.className = "small bad";
  throw new Error("Invalid schema");
}

elTitle.textContent = worksheet.title || "Worksheet";
elMeta.textContent = `rid=${rid} • questions=${worksheet.q.length}`;
elMeta.className = "small";
elFlowHint.textContent = worksheet.q.length === 1
  ? "Answer the question, optionally click Rewrite, then click Send Back to Parent."
  : "Answer each question in order, optionally click Rewrite per question, then click Send Back to Parent.";

const widgetControllers = [];

async function renderQuestions() {
  for (const [idx, qText] of worksheet.q.entries()) {
    const card = document.createElement("div");
    card.className = "card";

    const hostId = `rw_host_${idx}`;
    card.innerHTML = `
      <div class="question-text"><b>Q${idx + 1}.</b> ${escapeHtml(qText)}</div>
      <div class="small question-hint">Write your response here. Rewrite is optional.</div>
      <div id="${hostId}" class="rw-host"></div>
    `;
    elQuestions.appendChild(card);

    await RewriteWidget.mount({
      containerSelector: `#${hostId}`,
      apiBase: "",
      title: `Answer ${idx + 1}`,
      placeholder: "Type your answer, then click Rewrite if you want a polished version.",
      maxChars: 1200,
      statusPollIntervalMs: 5000,
      pollModelStatus: true
    });

    const textarea = card.querySelector(".rw-textarea");
    widgetControllers[idx] = {
      index: idx,
      question: qText,
      getAnswerText: () => (textarea ? textarea.value : "")
    };
  }
}

function buildAnswersPayload() {
  return widgetControllers.map((controller, idx) => {
    const answerText = controller.getAnswerText().trim();
    return {
      index: idx,
      question: controller.question,
      answer: answerText,
      raw: answerText,
      rewritten: answerText
    };
  });
}

renderQuestions().catch((err) => {
  elStatus.textContent = String(err?.message || err);
  elStatus.className = "small bad";
});

// Send back to parent
elSendBackBtn.addEventListener("click", () => {
  const payload = {
    type: "worksheetResult",
    rid,
    worksheet: { v: worksheet.v, title: worksheet.title, q: worksheet.q },
    answers: buildAnswersPayload(),
    meta: { sentAt: new Date().toISOString() }
  };

  if (!normalizedReturnOrigin) {
    elStatus.textContent = "Cannot send result: returnOrigin is missing or invalid.";
    elStatus.className = "small bad";
    return;
  }

  if (!window.opener) {
    elStatus.textContent = "No opener found (opened with noopener?). Cannot send back.";
    elStatus.className = "small bad";
    return;
  }

  window.opener.postMessage(payload, normalizedReturnOrigin);
  clearLaunchFromSession(rid);
  elStatus.textContent = "Sent back to parent ✅";
  elStatus.className = "small ok";
});

document.getElementById("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
