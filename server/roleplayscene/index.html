<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RolePlayScene</title>
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <header class="topbar">
    <h1>RolePlayScene</h1>
    <nav class="toolbar">
      <button id="mode-edit" class="active">Edit</button>
      <button id="mode-play">Play</button>
      <button id="import-btn" title="Import project (.json or .zip)">Import</button>
      <button id="export-btn" title="Export project archive (.zip)">Export</button>
      <span class="toolbar__server">
        <span id="server-status" class="server-status" aria-live="polite">Server: checking...</span>
        <button id="server-signin-btn" type="button">Sign in</button>
        <button id="server-save-btn" type="button">Save to Server</button>
        <button id="server-manage-btn" type="button">Manage Drafts</button>
      </span>
      <label class="file-input">
        <input type="file" id="file-input" accept=".json,.zip" hidden />
      </label>
      <label class="toolbar__locale">
        <span class="toolbar__locale-label">Language</span>
        <select id="locale-select"></select>
      </label>
    </nav>
  </header>

  <div id="app-messages" class="app-messages" aria-live="polite" role="status" hidden>
    <div class="app-messages__content">
      <span class="app-messages__text"></span>
      <div class="app-messages__details validation-results" hidden></div>
    </div>
    <button type="button" class="app-messages__dismiss" aria-label="Dismiss message">&times;</button>
  </div>

  <div id="import-confirm-overlay" class="confirm-overlay" hidden>
    <section
      class="confirm-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="import-confirm-title"
      aria-describedby="import-confirm-body"
    >
      <h2 id="import-confirm-title"></h2>
      <p id="import-confirm-body"></p>
      <div class="confirm-actions">
        <button type="button" id="import-confirm-cancel" class="confirm-actions__secondary"></button>
        <button type="button" id="import-confirm-accept" class="confirm-actions__primary"></button>
      </div>
    </section>
  </div>

  <div id="server-modal-overlay" class="server-modal-overlay" hidden>
    <section
      class="server-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="server-modal-title"
      tabindex="-1"
    >
      <div class="server-modal__header">
        <h2 id="server-modal-title"></h2>
        <button type="button" id="server-modal-close" class="server-modal__close" aria-label="Close">&times;</button>
      </div>
      <div id="server-modal-body" class="server-modal__body"></div>
      <div id="server-modal-actions" class="server-modal__actions"></div>
    </section>
  </div>

  <main id="app" class="layout">
    <section id="left-pane" class="pane">
      <!-- Editor graph or Player stage will render here -->
    </section>
    <section id="right-pane" class="pane">
      <!-- Inspector or Dialogue panel will render here -->
    </section>
  </main>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
